name: Metrics
on:
  schedule: [{cron: "0 6 * * *"}]   # daily at ~1-2am Toronto time
  workflow_dispatch:                 # lets you run it by hand from the Actions tab
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Main card: header, activity, repos + languages, contribution calendar, achievements
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          config_timezone: America/Toronto
          base: header, activity, community, repositories, metadata

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no

      # LeetCode card (optional) — uncomment and put your LeetCode username in
      # - uses: lowlighter/metrics@latest
      #   with:
      #     token: NOT_NEEDED
      #     filename: metrics.leetcode.svg
      #     base: ""
      #     plugin_leetcode: yes
      #     plugin_leetcode_user: YOUR_LEETCODE_USERNAME
      #     plugin_leetcode_sections: solved, skills, recent
